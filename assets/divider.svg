      <stop offset="15%" stop-color="#39FF14" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#FF2E97" stop-opacity="0.8"/>
